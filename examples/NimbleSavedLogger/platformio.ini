[platformio]
src_dir = .

[env:esp32c3]
platform = espressif32@6.8.1
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    symlink://../..
    h2zero/NimBLE-Arduino@2.3.6
build_flags =
    -DSANDISOLAR_USE_NIMBLE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
