name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host crypto test dependency
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Test dependency and distribution boundaries
        run: python3 -m unittest discover -s tools -p 'test_*.py'

  esp32c3-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Compile discovery and battery-read example (no upload)
        run: pio run --project-dir examples/ReadBatteryBle
      - name: Compile application-owned NimBLE example (no upload)
        run: pio run --project-dir examples/NimbleSavedLogger
